<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة التحكم</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0b1f1a;color:#f1efe6;padding:14px;max-width:760px;margin:auto}.c{background:#12302a;border-radius:14px;padding:14px;margin:10px 0}input,textarea{width:100%;box-sizing:border-box;margin:5px 0;padding:10px;border-radius:10px;border:1px solid #2a4a42;background:#0b1f1a;color:#f1efe6;font:inherit}button{border:0;border-radius:10px;padding:9px 14px;background:#e8c26b;color:#201a05;font-weight:700;margin:3px;font:inherit;cursor:pointer}button.g{background:#183b34;color:#f1efe6}.s{display:flex;gap:8px;flex-wrap:wrap}.s div{flex:1;min-width:110px;background:#183b34;border-radius:12px;padding:10px;text-align:center}.s b{display:block;font-size:22px;color:#e8c26b}.m{color:#8fb0a6;font-size:12px}.r{border-top:1px solid #2a4a42;padding:8px 0}[hidden]{display:none!important}</style></head><body>
<div id="login" class="c"><h3>دخول المدير</h3><input id="em" type="email" placeholder="الإيميل" autocomplete="username"><input id="pw" type="password" placeholder="كلمة السر" autocomplete="current-password"><button id="go">دخول</button><div id="err" class="m"></div></div>
<div id="app" hidden>
<div class="c"><div class="s"><div><b id="uAll">-</b>مستخدمين (فتحوا التطبيق)</div><div><b id="uD0">-</b>نشطين اليوم</div><div><b id="uD1">-</b>نشطين أمس</div><div><b id="gh">-</b>تحميلات APK</div></div><div class="m">«تحميلات APK» من GitHub وتشمل تحديثات التطبيق الداخلية.</div><button class="g" id="rf">تحديث</button></div>
<div class="c"><h3>إعلان جديد</h3><input id="aT" maxlength="80" placeholder="العنوان"><textarea id="aX" maxlength="200" rows="2" placeholder="نص قصير (اختياري)"></textarea><div class="m">صورة من جوالك:</div><input id="aF" type="file" accept="image/*"><img id="prev" hidden style="max-width:100%;border-radius:10px;margin:6px 0"><div class="m">أو رابط صورة:</div><input id="aI" placeholder="رابط الصورة https://..."><input id="aV" placeholder="رابط الفيديو https://... (mp4)"><input id="aL" placeholder="رابط الإعلان https://..."><input id="aM" type="number" min="1" placeholder="عدد الأشخاص (مثل 1000)"><button id="add">نشر</button><div id="msg" class="m"></div><div class="m">ارفع الصورة/الفيديو على مستودعك (مجلد ads) وانسخ رابط raw، أو أي استضافة برابط مباشر.</div></div>
<div class="c"><h3>الإعلانات</h3><div id="ads"></div><button class="g" id="clr">حذف المنتهية</button></div></div>
<script>
const K='AIzaSyCzFX9BQViEII6D5AJfA-ueDCV26d2z24s',DB='https://h-6fb50-default-rtdb.firebaseio.com',REPO='vvgvmohahadbbb-cell/ksjs';
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),ok=u=>/^https:\/\/[^\s"'<>]{4,500}$/.test(u);
const dk=t=>new Date((t||Date.now())+3*36e5).toISOString().slice(0,10);let tok='',AD={};
async function api(p,m,b){const r=await fetch(DB+'/'+p+(p.includes('?')?'&':'?')+'auth='+tok,{method:m||'GET',headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
$('#go').onclick=async()=>{try{const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+K,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#em').value.trim(),password:$('#pw').value,returnSecureToken:true})});const j=await r.json();if(!j.idToken)throw 0;tok=j.idToken;$('#pw').value='';$('#login').hidden=true;$('#app').hidden=false;load()}catch(e){$('#err').textContent='فشل الدخول'}};
const cnt=async p=>{try{return Object.keys(await api(p+'.json?shallow=true')||{}).length}catch(e){return '؟'}};
async function load(){
 cnt('users').then(n=>$('#uAll').textContent=n);cnt('dau/'+dk()).then(n=>$('#uD0').textContent=n);cnt('dau/'+dk(Date.now()-864e5)).then(n=>$('#uD1').textContent=n);
 fetch('https://api.github.com/repos/'+REPO+'/releases?per_page=100').then(r=>r.json()).then(a=>$('#gh').textContent=a.reduce((s,r)=>s+(r.assets||[]).reduce((x,y)=>x+(y.download_count||0),0),0)).catch(()=>$('#gh').textContent='؟');
 try{AD=await api('ads.json')||{}}catch(e){AD={}}
 const rows=Object.entries(AD).sort((a,b)=>(b[1].t||0)-(a[1].t||0));
 $('#ads').innerHTML=rows.length?rows.map(([id,a])=>{const end=a.views>=a.max,ctr=a.views?((a.clicks||0)/a.views*100).toFixed(1):'0';return '<div class="r"><b>'+esc(a.title)+'</b> '+(end?'⛔ منتهي':a.on?'🟢 شغّال':'⏸ موقوف')+'<div class="m">مشاهدات '+a.views+' / '+a.max+' · نقرات '+(a.clicks||0)+' ('+ctr+'%)</div><button class="g" data-t="'+id+'">'+(a.on?'إيقاف':'تشغيل')+'</button><button class="g" data-d="'+id+'">حذف</button></div>'}).join(''):'<div class="m">ما في إعلانات</div>'}
$('#ads').onclick=async e=>{const t=e.target.dataset.t,d=e.target.dataset.d;try{if(t)await api('ads/'+t+'.json','PATCH',{on:!AD[t].on});if(d&&confirm('حذف الإعلان؟')){await api('ads/'+d+'.json','DELETE');api('adimg/'+d+'.json','DELETE').catch(()=>{})}load()}catch(x){alert('فشل')}};
$('#clr').onclick=async()=>{try{for(const [id,a] of Object.entries(AD))if(a.views>=a.max){await api('ads/'+id+'.json','DELETE');api('adimg/'+id+'.json','DELETE').catch(()=>{})}load()}catch(x){alert('فشل')}};
$('#add').onclick=async()=>{const o={title:$('#aT').value.trim(),max:parseInt($('#aM').value,10),views:0,clicks:0,on:true,t:Date.now()},x=$('#aX').value.trim(),i=$('#aI').value.trim(),v=$('#aV').value.trim(),l=$('#aL').value.trim();
 if(!o.title||!(o.max>0))return $('#msg').textContent='اكتب العنوان والعدد';if(!i&&!v&&!PIC)return $('#msg').textContent='ضيف صورة أو فيديو';
 for(const u of [i,v,l])if(u&&!ok(u))return $('#msg').textContent='الروابط لازم تبدأ بـ https://';
 if(x)o.text=x;if(i&&!PIC)o.img=i;if(PIC)o.pic=true;if(v)o.vid=v;if(l)o.link=l;
 try{const r=await api('ads.json','POST',o);if(PIC){try{await api('adimg/'+r.name+'.json','PUT',PIC)}catch(e){await api('ads/'+r.name+'.json','DELETE');throw e}}PIC='';$('#prev').hidden=true;$('#aF').value='';$('#msg').textContent='تم النشر ✅';['aT','aX','aI','aV','aL','aM'].forEach(k=>$('#'+k).value='');load()}catch(e){$('#msg').textContent='فشل (تأكد من القواعد ومعرّف المدير)'}};
let PIC='';
$('#aF').onchange=e=>{const f=e.target.files[0];PIC='';$('#prev').hidden=true;if(!f)return;const im=new Image();im.onload=()=>{const w=Math.min(800,im.width),hh=Math.round(im.height*w/im.width),c=document.createElement('canvas');c.width=w;c.height=hh;c.getContext('2d').drawImage(im,0,0,w,hh);let q=.8,d;do{d=c.toDataURL('image/jpeg',q);q-=.1}while(d.length>200000&&q>.2);if(d.length>280000){$('#msg').textContent='الصورة كبيرة، جرّب أصغر';return}PIC=d;$('#prev').src=d;$('#prev').hidden=false;$('#msg').textContent='الصورة جاهزة ✅'};im.onerror=()=>$('#msg').textContent='ملف غير صالح';im.src=URL.createObjectURL(f)};
$('#rf').onclick=load;
</script></body></html>
